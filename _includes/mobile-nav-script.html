<script>
  function initializeMobileNavigation() {
    const menuToggle = document.querySelector(".menu-toggle");
    const navigation = document.querySelector(".navigation");

    if (!menuToggle || !navigation) return;

    menuToggle.addEventListener("click", () => {
      const isOpen = navigation.classList.toggle("is-open");
      menuToggle.setAttribute("aria-expanded", String(isOpen));
    });

    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", () => {
        if (window.innerWidth <= 920) {
          navigation.classList.remove("is-open");
          menuToggle.setAttribute("aria-expanded", "false");
        }
      });
    });
  }

  function escapeSiteHtml(value = "") {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getNestedValue(object, path) {
    return path.split(".").reduce((current, key) => {
      return current && current[key] !== undefined ? current[key] : undefined;
    }, object);
  }

  function renderContactInfo(site) {
    const contact = site.contact || {};
    const officeTitle = document.getElementById("contact-office-title");
    const officeLines = document.getElementById("contact-office-lines");
    const contactTitle = document.getElementById("contact-info-title");
    const contactDetails = document.getElementById("contact-info-details");

    if (officeTitle) officeTitle.textContent = contact.officeTitle || "Office";

    if (officeLines) {
      officeLines.innerHTML = Array.isArray(contact.officeLines)
        ? contact.officeLines.map(line => `<span>${escapeSiteHtml(line)}</span>`).join("<br />")
        : "";
    }

    if (contactTitle) {
      contactTitle.textContent = contact.contactTitle || "Contact Information";
    }

    if (contactDetails) {
      const email = contact.email
        ? `Email: <a class="text-link" href="mailto:${escapeSiteHtml(contact.email)}">${escapeSiteHtml(contact.email)}</a>`
        : "";
      const telephone = contact.telephone ? `Tel: ${escapeSiteHtml(contact.telephone)}` : "";
      contactDetails.innerHTML = [email, telephone].filter(Boolean).join("<br />");
    }
  }

  function updateSidebarSubtitleVisibility(site) {
    const subtitle = document.getElementById("lab-subtitle");
    const university = document.getElementById("site-university-name");
    const department = document.getElementById("site-department-name");
    const separator = document.getElementById("site-subtitle-separator");

    if (!subtitle || !university || !department || !separator) return;

    const universityName = String(site.universityName || "").trim();
    const departmentName = String(site.departmentName || "").trim();

    university.textContent = universityName;
    department.textContent = departmentName;
    university.hidden = !universityName;
    department.hidden = !departmentName;
    separator.hidden = !(universityName && departmentName);
    subtitle.hidden = !(universityName || departmentName);
  }

  async function updateSiteMetadata() {
    try {
      const response = await fetch("{{ '/data/site.json' | relative_url }}");
      if (!response.ok) return;

      const site = await response.json();

      document.querySelectorAll("[data-site-field]").forEach(element => {
        const value = getNestedValue(site, element.dataset.siteField);
        if (value !== undefined && value !== null) {
          element.textContent = value;
        }
      });

      updateSidebarSubtitleVisibility(site);
      renderContactInfo(site);
    } catch (error) {
      console.error(error);
    }
  }

  async function updatePeopleNavigation() {
    const studentsNavItem = document.getElementById("students-nav-item");

    if (!studentsNavItem) return;

    try {
      const response = await fetch("{{ '/data/people.json' | relative_url }}");
      if (!response.ok) return;

      const people = await response.json();
      const hasVisibleStudents = people.some(person => {
        return person.category === "student" && person.showOnHome !== false;
      });

      studentsNavItem.hidden = !hasVisibleStudents;
    } catch (error) {
      console.error(error);
    }
  }

  async function updateResearchNavigation() {
    const researchNavItem = document.getElementById("research-nav-item");

    if (!researchNavItem) return;

    try {
      const response = await fetch("{{ '/data/research.json' | relative_url }}");
      if (!response.ok) return;

      const research = await response.json();
      const hasVisibleResearch = research.some(item => {
        return item.showOnHome !== false;
      });

      researchNavItem.hidden = !hasVisibleResearch;
    } catch (error) {
      console.error(error);
    }
  }

  document.addEventListener("DOMContentLoaded", initializeMobileNavigation);
  document.addEventListener("DOMContentLoaded", updateSiteMetadata);
  document.addEventListener("DOMContentLoaded", updatePeopleNavigation);
  document.addEventListener("DOMContentLoaded", updateResearchNavigation);
</script>
