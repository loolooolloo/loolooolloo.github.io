<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>News · {{ site.title }}</title>

  <link
    rel="stylesheet"
      href="{{ '/assets/css/wio.css' | relative_url }}"
  />
</head>

<body>
  <div class="site-layout">
    {% include sidebar.html %}

    <main class="main-content">
      <div class="content-wrapper">
        <header class="news-page-header">
          <h2>News</h2>
        </header>

        <section id="all-news">
          <div
            id="news-list-page"
            class="news-list-page"
            aria-live="polite"
          ></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    window.NEWS_DATA_PATH =
      "{{ '/data/news.json' | relative_url }}";

    window.SITE_BASE_URL =
      "{{ '/' | relative_url }}";
  </script>

  <script
    src="{{ '/assets/js/news-page.js' | relative_url }}"
  ></script>

  {% include mobile-nav-script.html %}
</body>
</html>
